name: Deploy NGINX to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: $HOME/.kube/config
    run: |
    kubectl config current-context
    kubectl cluster-info
    kubectl get nodes

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v3

      - name: 📂 Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "🔍 Validating kubeconfig..."
          kubectl config view
          kubectl cluster-info

      - name: 🚀 Deploy NGINX to Kubernetes
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx-deployment
            labels:
              app: nginx
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nginx
            template:
              metadata:
                labels:
                  app: nginx
              spec:
                containers:
                - name: nginx
                  image: nginx:stable
                  ports:
                  - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-service
          spec:
            type: NodePort
            selector:
              app: nginx
            ports:
              - protocol: TCP
                port: 80
                targetPort: 80
                nodePort: 30080
          EOF
